name: DAW AI Orchestration Build

on:
  workflow_dispatch:
    inputs:
      day:
        description: 'Build day (1-7)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
      trigger:
        description: 'Trigger execution'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install anthropic google-generativeai openai pyyaml
    
    - name: Configure Git
      run: |
        git config user.name "OrchestrAI Bot"
        git config user.email "orchestrai@joker5514.dev"
    
    - name: Run DAW Build - Day ${{ github.event.inputs.day }}
      run: |
        cd orchestrator
        python controller.py --day ${{ github.event.inputs.day }} --trigger
      continue-on-error: true
    
    - name: Push generated files
      run: |
        git pull --rebase
        git push origin main
      continue-on-error: true
    
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-day-${{ github.event.inputs.day }}
        path: orchestrator/logs/
        retention-days: 30
    
    - name: Notify completion
      if: always()
      run: |
        echo "✅ DAY ${{ github.event.inputs.day }} Build Complete"
        echo "Generated files pushed to main branch"
        echo "View logs in: orchestrator/logs/"

  # Schedule daily builds (optional)
  scheduled-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    strategy:
      matrix:
        day: [1, 2, 3, 4, 5, 6, 7]
    
    steps:
    - name: Trigger build for day ${{ matrix.day }}
      run: |
        echo "Running Day ${{ matrix.day }} build..."
        # This would trigger the main build job
